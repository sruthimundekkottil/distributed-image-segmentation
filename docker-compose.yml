# Start everything:          docker compose up --build
# Start with 4 workers:      docker compose up --build --scale worker=4
# Pick the model:            MODEL_NAME=mobilenet_v2 docker compose up

# Settings shared by the api and worker containers.
x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0
  MODEL_NAME: ${MODEL_NAME:-mobilenet_v2}
  MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-100}
  # CPU threads per inference call. 1 thread per worker means
  # "--scale worker=N" uses about N cores.
  ORT_NUM_THREADS: ${ORT_NUM_THREADS:-1}

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *common-env
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *common-env
    volumes:
      # Workers write result.json / preview.png here; it is shared with the
      # api container and visible on your machine in ./outputs.
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
