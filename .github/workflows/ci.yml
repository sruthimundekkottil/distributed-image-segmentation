name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatting)
        run: ruff format --check .

      # The tests use fakeredis and a fake model, so no Redis server
      # or exported ONNX file is needed in CI.
      - name: Pytest
        run: pytest -q
